<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d1a">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Станція «Обрій»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed canvas game (station interior or ring flight), HUD floats on top, device panels open as a console sheet from the bottom. Single dark look by choice. */
:root{
  --space:#120d1a;
  --panel:#231a2a;
  --panel-2:#2e2335;
  --line:#4b3b54;
  --cream:#f3e6c8;
  --muted:#b6a5b4;
  --amber:#f2b64a;
  --amber-d:#a8701f;
  --teal:#4fb3ad;
  --rust:#d8613c;
  --ice:#bfefff;
  --iron:#ff9a4a;
  --irid:#e2a0ff;
  --squid:#ff6fa8;
  --lyb:#7ff5ea;
  --shop:#00a046;
  --shop-d:#007a35;
  --post:#da291c;
  --display:'Exo 2','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--space);color:var(--cream);overflow:hidden;font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;overflow:hidden}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:var(--display);cursor:pointer;border:0}
button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;flex-direction:column;gap:6px}
.bars{display:flex;gap:8px;align-items:flex-end}
.meter{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#hud.base #fuelMeter{display:none}
.lbl{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--muted);display:flex;justify-content:space-between}
.lbl b{color:var(--cream);font-weight:700;font-variant-numeric:tabular-nums;display:inline-block}
.lbl b.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.35);color:#fff}}
.track{height:10px;background:#0b0810;border:2px solid var(--line);position:relative;overflow:hidden;border-radius:2px}
.track i{position:absolute;inset:0;width:100%;transform-origin:left;background:var(--amber);transition:transform .12s ease-out}
#cargoBar{background:var(--teal)}
.track.low{border-color:var(--rust);animation:blink .6s steps(2) infinite}
.track.full{border-color:var(--teal)}
@keyframes blink{50%{border-color:var(--line)}}
.money{font-family:var(--display);font-size:15px;font-weight:700;background:#0b0810;border:2px solid var(--line);border-radius:2px;padding:2px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbtn{pointer-events:auto;background:#0b0810;border:2px solid var(--line);border-radius:2px;color:var(--cream);width:28px;height:28px;display:grid;place-items:center;padding:0;flex:none}
.hbtn svg{display:block}
#zone{align-self:center;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:rgba(11,8,16,.65);padding:2px 8px}
#zone.danger{color:var(--rust)}
#zone.room{color:var(--amber)}
#arrow{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:700;font-size:11px;color:var(--amber);text-shadow:0 1px 0 #000}
#arrow svg{display:block}
.bigbtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));background:var(--amber);color:#1b1206;font-size:17px;font-weight:800;padding:12px 22px;border-radius:3px;box-shadow:0 4px 0 var(--amber-d);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.bigbtn:active{transform:translate(-50%,3px);box-shadow:0 1px 0 var(--amber-d)}
#dockBtn{animation:bob 1s ease-in-out infinite;bottom:calc(128px + env(safe-area-inset-bottom,0px))}
@keyframes bob{50%{transform:translate(-50%,-3px)}}
.bigbtn kbd{font-family:var(--display);font-size:11px;opacity:.55;margin-left:6px}
#grabBtn{position:absolute;right:max(112px,calc(env(safe-area-inset-right,0px) + 106px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:70px;height:70px;border-radius:50%;padding:0;
  background:conic-gradient(var(--squid) calc(var(--p,1)*360deg),#2e2335 0);border:3px solid #1c1428;box-shadow:0 4px 0 #0b0810;display:grid;place-items:center}
#grabBtn span{width:56px;height:56px;border-radius:50%;background:#2a1a33;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;color:#ffd6ea;line-height:1.1;text-align:center}
#grabBtn.ready span{background:#5a2a52;color:#fff}
#grabBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0810}
#grabBtn.perun{background:conic-gradient(#ffe95a calc(var(--p,1)*360deg),#2e2335 0)}
#grabBtn.perun span{background:#1a2440;color:#fff6a0}
#grabBtn.perun.ready span{background:#2f4a8a}
#fireBtn{position:absolute;right:max(16px,calc(env(safe-area-inset-right,0px) + 10px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;padding:0;touch-action:none;
  background:conic-gradient(var(--hc,#f2b64a) calc(var(--h,1)*360deg),#2e2335 0);border:3px solid #1c1428;box-shadow:0 4px 0 #0b0810;display:grid;place-items:center}
#fireBtn span{width:72px;height:72px;border-radius:50%;background:#3a2410;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;color:#ffe9b0;line-height:1.1;text-align:center}
#fireBtn.on span{background:#6a3a14}
#fireBtn.hot span{background:#4a1018;color:#ffb0b0}
#toast{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:78px;display:flex;gap:10px;align-items:flex-start;background:rgba(24,22,40,.95);border:2px solid #34405a;border-radius:6px;padding:8px 10px;pointer-events:none;max-width:520px;margin-inline:auto}
#toast canvas{width:28px;height:24px;flex:none}
#toast p{margin:0;font-size:13.5px;line-height:1.4}
#toast b{font-family:var(--display);color:var(--lyb);font-weight:800;letter-spacing:.06em;margin-right:4px}
#toast{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px))}
#app.inbase #toast{top:auto;bottom:calc(92px + env(safe-area-inset-bottom,0px))}
#joy{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border:2px solid rgba(243,230,200,.25);border-radius:50%;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;background:rgba(242,182,74,.7);border-radius:50%}
#tut{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:180px;text-align:center;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.4;color:var(--cream);text-shadow:0 2px 0 #000;pointer-events:none}
#app.inbase #tut{bottom:auto;top:84px}
#flash{position:absolute;inset:0;background:var(--rust);opacity:0;pointer-events:none;transition:opacity .25s}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}

/* Device panel */
#panel{position:absolute;inset:0;background:rgba(8,5,12,.55);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{max-height:86%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--space);border-top:3px solid var(--line);box-shadow:0 -6px 0 rgba(0,0,0,.35)}
.sheet-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--space);padding-block:4px;z-index:2}
.ph h1{margin:0;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;color:var(--amber);text-wrap:balance}
.ph p{margin:2px 0 0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#closeBtn{background:var(--panel-2);color:var(--cream);border:2px solid var(--line);border-radius:3px;padding:6px 12px;font-size:14px;font-weight:700;box-shadow:0 3px 0 #120d16;flex:none}
.testbar{font-size:12px;font-weight:600;color:#bff7f2;background:#123a3a;border:1px dashed var(--teal);border-radius:3px;padding:6px 9px}
.lybc{display:flex;gap:12px;align-items:flex-start}
.lybc canvas{width:42px;height:36px;flex:none}
.bubble{background:#1d2340;color:#e8f6ff;padding:10px 12px;position:relative;font-size:14.5px;line-height:1.45;flex:1;min-width:0;border-radius:8px;border:2px solid #34405a}
.bubble::before{content:"";position:absolute;left:-9px;top:12px;border:8px solid transparent;border-right-color:#34405a;border-left:0}
.bubble b{display:block;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--lyb);margin-bottom:2px}
.box{background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-family:var(--display);font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.box h2 small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.note{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.res i{width:10px;height:10px;display:inline-block;transform:rotate(45deg)}
.res.ice i{background:var(--ice)} .res.iron i{background:var(--iron)} .res.irid i{background:var(--irid)}
.unload{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.unload .res{font-size:15px;min-width:0}
.unload .res span{color:var(--muted);font-size:12px}
.btn{background:var(--amber);color:#1b1206;font-size:14px;font-weight:700;padding:8px 10px;border-radius:3px;box-shadow:0 3px 0 var(--amber-d);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--amber-d)}
.btn.alt{background:var(--panel-2);color:var(--cream);box-shadow:0 3px 0 #120d16;border:2px solid var(--line);padding:6px 9px}
.btn.big{font-size:19px;font-weight:800;padding:13px;width:100%;box-shadow:0 5px 0 var(--amber-d)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.prog{height:12px;background:#0b0810;border:2px solid var(--line);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--teal)}
.qline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.qline .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
.strict{background:#3a1814;border:2px solid var(--rust);color:#ffd9cc;padding:8px 10px;font-size:13px;line-height:1.4}
.bank{background:linear-gradient(140deg,#1b1b1f,#0c0c0e);border-color:#3a3a40}
.bankhead{display:flex;align-items:center;gap:10px}
.bankhead canvas{width:30px;height:27px}
.bankhead .bn{font-family:var(--display);font-size:17px;font-weight:800}
.bankhead .bt{font-size:11.5px;color:#9a9aa3}
.bal{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
.tx{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.tx div{display:flex;justify-content:space-between;gap:10px;color:#c9c9d1}
.tx div span:last-child{font-variant-numeric:tabular-nums;color:#7ee0a6}
.tx div.neg span:last-child{color:#ff9d8a}
.chips{display:flex;gap:14px;flex-wrap:wrap;font-size:15px}
.upg{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding-block:10px;border-top:1px dashed var(--line)}
.upg:first-of-type{border-top:0;padding-top:0}
.upg .nm{font-family:var(--display);font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;background:#0b0810;border:1px solid var(--line)}
.dots i.on{background:var(--amber);border-color:var(--amber)}
.upg .st{font-size:12.5px;color:var(--muted);grid-column:1}
.upg .cost{font-size:12.5px;grid-column:1;display:flex;gap:10px;flex-wrap:wrap}
.upg .cost .no{color:var(--rust)}
.upg button{grid-column:2;grid-row:1 / span 3;align-self:center}
.upg .lock{font-size:12px;color:#c9a4ff;grid-column:1}
.donate{border-color:#7a5a20;background:linear-gradient(160deg,#33240f,var(--panel))}
.donate .row{justify-content:space-between}
.star{color:var(--amber)}
.coll{display:flex;gap:16px;flex-wrap:wrap}
.coll div{display:flex;align-items:center;gap:8px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{background:#0b0810;border:2px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats b{font-family:var(--display);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ships{display:flex;flex-direction:column;gap:10px}
.shipc{display:grid;grid-template-columns:52px 1fr;gap:4px 12px;align-items:center;padding:10px;background:#1a1320;border:2px solid var(--line);border-radius:3px}
.shipc.on{border-color:var(--amber)}
.shipc canvas{grid-row:1 / span 3;width:52px;height:60px;background:#0b0810;border-radius:2px}
.shipc .sn{font-family:var(--display);font-weight:800;font-size:16px}
.shipc .sd{font-size:12.5px;color:var(--muted);line-height:1.4}
.shipc .sa{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.skins{display:flex;gap:8px;flex-wrap:wrap}
.skins button{font-size:13px;font-weight:700;padding:6px 10px;border-radius:3px;background:var(--panel-2);color:var(--cream);border:2px solid var(--line)}
.skins button.on{border-color:var(--amber);color:var(--amber)}
.crew{display:flex;gap:10px;flex-wrap:wrap}
.crew span{font-family:var(--display);font-weight:700;font-size:13px;padding:3px 9px;border:2px solid var(--line);border-radius:3px;color:var(--muted)}
.crew span.on{border-color:var(--teal);color:var(--cream)}

/* «Подовжувач» marketplace */
.shop{background:#f4f6f5;color:#221f1f;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.shop-h{background:var(--shop);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.shop-h .logo{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.shop-h .logo svg{display:block}
.shop-h .bal2{margin-left:auto;font-weight:700;font-size:13px;background:rgba(0,0,0,.18);padding:3px 8px;border-radius:12px;font-variant-numeric:tabular-nums}
.shop-s{margin:10px 12px 0;background:#fff;border:2px solid var(--shop);border-radius:6px;padding:7px 10px;font-size:13px;color:#8b8b8b}
.shop-tabs{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
.shop-tabs button{font-family:var(--body);font-weight:600;font-size:13px;padding:6px 12px;border-radius:16px;background:#e3e8e5;color:#221f1f}
.shop-tabs button.on{background:#221f1f;color:#fff}
.shop-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.prod{background:#fff;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 #dfe3e1;min-width:0}
.prod canvas{width:100%;height:70px;background:#f1f3f2;border-radius:4px}
.prod .pn{font-size:13px;font-weight:600;line-height:1.3}
.prod .pd{font-size:11.5px;color:#6b6b6b;line-height:1.35}
.prod .pp{font-family:var(--display);font-weight:800;font-size:17px;color:#f84147;font-variant-numeric:tabular-nums}
.prod .pp s{color:#a0a0a0;font-size:12px;font-weight:600;margin-left:6px}
.prod button{background:var(--shop);color:#fff;font-family:var(--body);font-weight:700;font-size:13px;padding:8px;border-radius:4px;margin-top:auto}
.prod button:disabled{background:#cfd6d2;color:#7b7b7b}
.prod .got{font-size:12px;font-weight:700;color:var(--shop-d)}
.shop-f{font-size:11.5px;color:#6b6b6b;padding:0 12px 12px}

/* «Наднова Пошта» locker */
.post{background:#fff;color:#1f1f1f;border-radius:6px;overflow:hidden}
.post-h{background:var(--post);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px}
.post-b{padding:12px;display:flex;flex-direction:column;gap:12px}
.ttn{border:1px solid #e3e3e3;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ttn .tn{font-size:12px;color:#7a7a7a;font-variant-numeric:tabular-nums}
.ttn .ti{font-size:13.5px;font-weight:600}
.route{display:flex;flex-direction:column;gap:0}
.route div{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-size:12.5px;color:#a0a0a0;padding:3px 0}
.route div i{width:10px;height:10px;border-radius:50%;border:2px solid #d0d0d0;background:#fff;justify-self:center}
.route div.done{color:#1f1f1f}.route div.done i{background:var(--post);border-color:var(--post)}
.route div.now{color:#1f1f1f;font-weight:700}.route div.now i{background:#fff;border-color:var(--post);box-shadow:0 0 0 3px rgba(218,41,28,.2)}
.route div span:last-child{font-variant-numeric:tabular-nums;font-size:11.5px}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cells span{height:22px;border-radius:3px;background:#efefef;border:1px solid #dedede}
.cells span.full{background:var(--post);border-color:#b31f14}
.post .btn{background:var(--post);color:#fff;box-shadow:0 3px 0 #9b1a10}
.post .note{color:#6b6b6b}
.goalpill{align-self:center;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.04em;color:#bff7f2;background:rgba(11,8,16,.65);padding:2px 8px;border-radius:10px}
#tasksHud{align-self:flex-start;display:flex;flex-direction:column;gap:3px;font-family:var(--display);font-size:11.5px;font-weight:700;color:var(--cream);text-shadow:0 1px 0 #000}
#tasksHud div{display:flex;gap:6px;align-items:center;background:rgba(11,8,16,.55);padding:2px 7px;border-radius:3px}
#tasksHud div.done{color:#7ee0a6}
#tasksHud b{font-variant-numeric:tabular-nums;color:var(--amber)}
#sigArrow{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:700;font-size:11px;color:var(--lyb);text-shadow:0 1px 0 #000}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:13px;font-weight:700;padding:7px 12px;border-radius:16px;background:var(--panel-2);color:var(--cream);border:2px solid var(--line)}
.tabs button.on{background:var(--lyb);color:#0b1a1f;border-color:var(--lyb)}
.task{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:8px;border-top:1px dashed var(--line)}
.task:first-of-type{border-top:0;padding-top:0}
.task .tn{font-weight:600;font-size:14px}
.task .tr{font-size:12px;color:var(--amber);font-weight:600;text-align:right}
.task .prog{grid-column:1 / span 2;height:8px}
.frag{background:#0e1626;border:1px solid #2a3a5a;border-radius:4px;padding:9px 11px;font-size:13.5px;line-height:1.5;color:#cfe6ff;font-family:'IBM Plex Sans',monospace}
.frag small{display:block;color:#7aa0c8;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}

.act.done{border-color:var(--teal);opacity:.85}
.act.lock{opacity:.5}

.act.now i{border-color:var(--lyb);color:var(--lyb)}

.act span{font-size:12px;color:var(--muted)}

.card canvas{width:100%;height:auto;aspect-ratio:64/30;border-radius:2px;max-width:100%}
.card p{margin:0;font-size:13px;line-height:1.45}
.card small{font-size:11px;color:#7a6a5a;letter-spacing:.05em;text-transform:uppercase}
.threat{background:#2a1220;border:2px solid #6a2a48;border-radius:4px;padding:8px 10px;font-size:13px;color:#ffc6dd}
.testrow{display:flex;gap:8px;flex-wrap:wrap}
.botc{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding-block:10px;border-top:1px dashed var(--line)}
.botc:first-of-type{border-top:0;padding-top:0}
.botc .nm{font-family:var(--display);font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center}
.botc .st{font-size:12.5px;color:var(--muted);grid-column:1}
.botc .cost{font-size:12.5px;grid-column:1;display:flex;gap:10px;flex-wrap:wrap}
.botc button{grid-column:2;grid-row:1 / span 3;align-self:center}
#cargoTxt i{font-style:normal;color:var(--lyb)}
#fireBtn span{transition:transform .05s}
#intro{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#22183a 0,#0b0812 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:60px 40px;z-index:5}
#intro canvas{width:min(100%,360px);height:auto;aspect-ratio:200/110;image-rendering:pixelated;max-width:100%}
#intro p{margin:0;max-width:36ch;text-align:center;font-size:17px;line-height:1.55;color:var(--cream);text-wrap:pretty;min-height:7.8em}
#intro .dots{display:flex;gap:6px}
#intro .dots i{width:7px;height:7px;border-radius:50%;background:#3a2e50}
#intro .dots i.on{background:var(--lyb)}
#intro .nav{display:flex;gap:10px;width:100%;max-width:360px}
#intro .nav .btn{flex:1;font-size:17px;padding:12px}
#introSkip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:transparent;color:var(--muted);font-family:var(--display);font-weight:700;font-size:14px;padding:6px 8px}
.tiplist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45}
.tiplist b{color:var(--amber);font-weight:600}
.res.chit i{background:#7a5cff}
#hud.base #hpMeter{display:none}

.stabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}

.stabs button.on{background:var(--amber);color:#1b1206;border-color:var(--amber)}

.secinfo b{font-family:var(--display);font-size:16px}
.secinfo span{font-size:12.5px;color:var(--muted);line-height:1.45}

.loadout{display:flex;gap:8px;flex-wrap:wrap}

.loadout button.on{border-color:var(--amber);background:#3a2a14}

.sk:first-of-type{border-top:0;padding-top:0}
.sk .nm{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sk .st{font-size:12.5px;color:var(--muted);grid-column:1}
.sk button{grid-column:2;grid-row:1 / span 2;min-width:44px}
.sk.ult .nm{color:var(--amber)}
.lvbig{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.sp{font-family:var(--display);font-weight:800;color:var(--lyb)}

.rep span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rep b{font-family:var(--display);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.levelup{background:linear-gradient(90deg,#1d3a3a,#2a1d3a);border:2px solid var(--lyb);border-radius:4px;padding:10px 12px;font-family:var(--display);font-weight:800;font-size:16px;color:#bff7f2}
.nextstep{background:#1d2a3a;border:2px solid #3f6f9a;border-radius:4px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nextstep span{font-size:13.5px;line-height:1.4;flex:1;min-width:180px}
.orbitrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:9px;border-top:1px dashed var(--line)}
.orbitrow:first-of-type{border-top:0;padding-top:0}
.orbitrow b{font-family:var(--display);font-size:15px}
.orbitrow .st{font-size:12px;color:var(--muted);grid-column:1;line-height:1.4}
.orbitrow button,.orbitrow .now{grid-column:2;grid-row:1 / span 2}
.orbitrow .now{font-size:12px;font-weight:700;color:var(--lyb)}
#orbitCv{width:100%;max-width:300px;height:auto;aspect-ratio:220/150;align-self:center;image-rendering:pixelated}
@media (prefers-reduced-motion:reduce){#dockBtn,.track.low,.lbl b.bump{animation:none}}

function rockTex(type,R,seed){
  const rnd=mulberry(seed),S2=R*2+3,c=document.createElement('canvas');c.width=c.height=S2;
  const x=c.getContext('2d'),C=S2/2,P=ROCK[type];
  const ph=[rnd()*6.3,rnd()*6.3,rnd()*6.3],am=[.06+rnd()*.1,.04+rnd()*.08,.05+rnd()*.1];
  const inside=(i,j)=>{const dx=i+.5-C,dy=j+.5-C,th=Math.atan2(dy,dx);
    const rr=R*(.86+am[0]*Math.sin(3*th+ph[0])+am[1]*Math.sin(5*th+ph[1])+am[2]*Math.sin(2*th+ph[2]));return Math.hypot(dx,dy)<=rr};
  const craters=[];for(let k=0;k<1+R/5;k++)craters.push([C+(rnd()-.5)*R,C+(rnd()-.5)*R,1+rnd()*R/4]);
  for(let j=0;j<S2;j++)for(let i=0;i<S2;i++){
    if(!inside(i,j))continue;
    const edge=!inside(i+1,j)||!inside(i-1,j)||!inside(i,j+1)||!inside(i,j-1);
    const dx=i+.5-C,dy=j+.5-C;let col;
    if(edge)col=P.o;else{const l=(-dx-dy)/R;let t=l>.35?0:l>-.3?1:2;
      for(const [cx,cy,cr] of craters){if(Math.hypot(i-cx,j-cy)<cr)t=Math.min(2,t+1)}
      col=P.t[t];if(rnd()<(type==='irid'?.12:.08))col=P.ore}
    x.fillStyle=col;x.fillRect(i,j,1,1);
  }
  return c;
}

function makeCracks(R){
  const out=[],o=[(rnd()-.5)*R*.4,(rnd()-.5)*R*.4];
  for(let k=0;k<5;k++){let a=rnd()*6.28,x=o[0],y=o[1];const pts=[[x,y]];const segs=2+((rnd()*2)|0);
    for(let s=0;s<segs;s++){a+=(rnd()-.5)*1.2;const len=R*(.25+rnd()*.25);x+=Math.cos(a)*len;y+=Math.sin(a)*len;
      const d=Math.hypot(x,y);if(d>R*.8){x*=R*.8/d;y*=R*.8/d}pts.push([x,y])}
    out.push(pts)}
  return out;
}

function tilePath(x0,y0,x1,y1){
  const s=[Math.floor(x0/TS),Math.floor(y0/TS)],g=[Math.floor(x1/TS),Math.floor(y1/TS)];
  if(!isFloor(...s)||!isFloor(...g))return[];
  const key=(x,y)=>y*MW+x,prev=new Map([[key(...s),null]]),q=[s];
  while(q.length){const[cx,cy]=q.shift();if(cx===g[0]&&cy===g[1])break;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy,k=key(nx,ny);if(!isFloor(nx,ny)||prev.has(k))continue;prev.set(k,[cx,cy]);q.push([nx,ny])}}
  if(!prev.has(key(...g)))return[];
  const out=[];let cur=g;while(cur){out.unshift({x:cur[0]*TS+8,y:cur[1]*TS+10});cur=prev.get(key(...cur))}
  out[out.length-1]={x:x1,y:y1};return out.slice(1);
}
function randomFloor(){for(let i=0;i<50;i++){const tx=1+(rnd()*(MW-2)|0),ty=1+(rnd()*(MH-2)|0);if(isFloor(tx,ty)&&ftype[ty][tx]!=='door')return{x:tx*TS+4+rnd()*8,y:ty*TS+6+rnd()*6}}return{x:40,y:70}}
function catGo(p,next){kat.path=tilePath(kat.x,kat.y,p.x,p.y);kat.state='walk';kat.next=next||'idle'}
function updateCat(dt){
  kat.t-=dt;if(kat.hearts>0)kat.hearts-=dt;
  if(kat.state==='walk'){
    const p=kat.path[0];if(!p){kat.state=kat.next;kat.t=kat.next==='sleep'?8+rnd()*6:kat.next==='play'?7:2+rnd()*3;return}
    const dx=p.x-kat.x,dy=p.y-kat.y,d=Math.hypot(dx,dy);if(d<1.5){kat.path.shift();return}
    const sp=kat.next==='play'?52:30;kat.x+=dx/d*sp*dt;kat.y+=dy/d*sp*dt;if(Math.abs(dx)>.5)kat.dir=dx>0?1:-1;kat.walk+=dt*8;return}
  if(kat.state==='play'){
    const dx=ballO.x-kat.x,dy=ballO.y-kat.y,d=Math.hypot(dx,dy);
    if(d>5){kat.x+=dx/d*48*dt;kat.y+=dy/d*48*dt;kat.dir=dx>0?1:-1;kat.walk+=dt*10}
    else{const a=rnd()*6.28;ballO.vx=Math.cos(a)*90;ballO.vy=Math.sin(a)*90;if(rnd()<.3)SFX.ui()}
    if(kat.t<=0){kat.state='idle';kat.t=2}return}
  if(kat.t<=0){
    const r=rnd();
    if(r<.25){kat.state='sleep';if(S.have.bed&&rnd()<.7)catGo({x:32,y:70},'sleep');kat.t=8+rnd()*6}
    else if(r<.42&&S.have.ball){ballO.x=kat.x;ballO.y=kat.y;ballO.vx=60;ballO.vy=0;kat.state='play';kat.t=7}
    else if(r<.55){catGo({x:man.x+(rnd()-.5)*20,y:man.y+4},'idle')}
    else catGo(randomFloor(),'idle');
  }
  // hungry meow when close to the player
  kat.meowT-=dt;if(!catHappy()&&kat.meowT<=0&&Math.hypot(kat.x-man.x,kat.y-man.y)<40&&mode==='base'){kat.meowT=12;SFX.meow()}
}
function updateBall(dt){
  if(Math.abs(ballO.vx)+Math.abs(ballO.vy)<1)return;
  const nx=ballO.x+ballO.vx*dt,ny=ballO.y+ballO.vy*dt;
  if(solidAt(nx,ballO.y))ballO.vx*=-.8;else ballO.x=nx;if(solidAt(ballO.x,ny))ballO.vy*=-.8;else ballO.y=ny;
  ballO.vx*=Math.max(0,1-dt*1.6);ballO.vy*=Math.max(0,1-dt*1.6);
}

/* ---- giant boulders: cell grids that get carved and split ---- */
const CS=3,HHP={ice:5,iron:8,irid:12};
let huges=[];
function makeHuge(x,y,type,R){
  const n=Math.ceil(R*2/CS)+2,cells=new Uint8Array(n*n),ore=new Uint8Array(n*n),r=mulberry((x*7+y*13)|0),ph=[r()*6,r()*6,r()*6];let count=0;
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){const dx=(i+.5-n/2)*CS,dy=(j+.5-n/2)*CS,th=Math.atan2(dy,dx);
    const rad=R*(.86+.09*Math.sin(3*th+ph[0])+.06*Math.sin(5*th+ph[1])+.04*Math.sin(7*th+ph[2]));
    if(Math.hypot(dx,dy)<=rad){cells[j*n+i]=HHP[type];ore[j*n+i]=r()<.1?1:0;count++}}
  const cv=document.createElement('canvas');cv.width=cv.height=n*CS;
  return{x:x-n*CS/2,y:y-n*CS/2,cx:x,cy:y,n,cells,ore,type,cv,dirty:true,split:false,count,seen:false};
}
function cellIdx(h,wx,wy){const i=Math.floor((wx-h.x)/CS),j=Math.floor((wy-h.y)/CS);if(i<0||j<0||i>=h.n||j>=h.n)return-1;return j*h.n+i}
function hugeAt(wx,wy){for(const h of huges){if(wx<h.x||wy<h.y||wx>=h.x+h.n*CS||wy>=h.y+h.n*CS)continue;const k=cellIdx(h,wx,wy);if(k>=0&&h.cells[k])return h}return null}
let carveSnd=0;
function hugeDamage(h,wx,wy,rc,dmg){dmg*=1+sk('tecton');
  const ci=Math.floor((wx-h.x)/CS),cj=Math.floor((wy-h.y)/CS),r=Math.ceil(rc);let gone=0;const P=ROCK[h.type];
  for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){if(di*di+dj*dj>rc*rc+.5)continue;const i=ci+di,j=cj+dj;if(i<0||j<0||i>=h.n||j>=h.n)continue;const k=j*h.n+i;if(!h.cells[k])continue;

function drawStars(vw,vh,parx){

    for(let ox=x;ox<vw;ox+=Tl)for(let oy=y;oy<vh;oy+=Tl){ctx.fillStyle=s.c;ctx.globalAlpha=s.l?.9:.45;ctx.fillRect(Math.round(ox)*scale,Math.round(oy)*scale,scale,scale)}}
  ctx.globalAlpha=1;
}
function pxLine(c,x0,y0,x1,y1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx+dy;
  for(let i=0;i<200;i++){c.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx}if(e2<=dx){err+=dx;y0+=sy}}}

  const ox=Math.round((cam.x-vw/2)*scale)/scale,oy=Math.round((cam.y-vh/2)*scale)/scale;

function orbitArt(c){

  SECTORS.forEach((sc,i)=>{const a0=-Math.PI/2+i*Math.PI/2-Math.PI/4,a1=a0+Math.PI/2;x.strokeStyle=sc.col;x.globalAlpha=i===cur?1:.35;x.lineWidth=i===cur?4:2;x.beginPath();x.ellipse(110,75,98,62,0,a0+.05,a1-.05);x.stroke();

 storage:{t:'Облік складу',s:'склад',b(){return`<section class="box"><h2>Запаси</h2><div class="stats">${RES.map(r=>`<div><span>${RNAME[r]}</span><b>${S.store[r]}</b></div>`).join('')}</div>
   <p class="note">Кожен ящик на складі вміщує 15 од. Руда звідси йде на верстат, модулі й конвеєр.</p></section>`}},
 conveyor:{t:'Конвеєр автоботів',s:'цех · брати-засновники',b(){return secBots()+secStoreChips()}},
 bunker:{t:'Бункер ботів',s:'цех · оффлайн-видобуток',b(){const dp=dronePending();
   if(!dp)return`<section class="box"><h2>Бункер порожній</h2><p class="note">Ботів ще немає. Збудуй Кия на конвеєрі.</p></section>`;
   return`<section class="box"><h2>Здобич ботів <small>${crewNames()} · ${botRate()} од./год</small></h2>`+(dp.total?
     `<div class="chips">${RES.map(r=>dp[r]?resChip(r,dp[r],' '+RNAME[r].toLowerCase()):'').join('')}</div><button class="btn" data-a="drones">Забрати на склад</button>`
     :`<p class="note">Боти працюють. Перша партія приблизно за ${Math.ceil(60/botRate())} хв, максимум накопичують 8 годин.</p>`)+`</section>`}},
 bowl:{t:`Миска ${CAT}а`,s:'кухня',b(){const h=catHappy();
   return secLyb(h?`${CAT} ситий. Він уже двічі сказав «мяу», що означає «дякую» і «ще».`:LINES.hungry)+
   `<section class="box"><h2>${CAT} <small>${h?'ситий і щасливий':'голодний'}</small></h2><div class="stats"><div><span>Корму в запасі</span><b>${S.cat.food} порц.</b></div><div><span>Бонус</span><b>${h?'удача +5%':'—'}</b></div></div>
   <button class="btn" data-a="feed" ${S.cat.food>0&&!h?'':'disabled'}>${h?'Ще не зголоднів':'Насипати корм'}</button>
   <p class="note">Котик їсть раз на два рейси. Ситий кіт додає удачі: частіше випадає подвійна руда. Корм замовляй на «Подовжувачі» в гаражі.</p></section>`}},
 shelf:{t:'Полиця знахідок',s:'кухня · колекція',b(){return`<section class="box"><h2>Знайдено в кільці</h2><div class="coll">
    <div><canvas class="pix" width="9" height="9" id="cBag" style="width:27px;height:27px"></canvas>Пакет з пакетами × ${S.found.bag}</div>
    <div><canvas class="pix" width="5" height="10" id="cCap" style="width:15px;height:30px"></canvas>Капсули сигналу × ${S.frags.length}</div></div>
    <p class="note">Порожні капсули Либідь віддає сюди після розшифровки. Текст сигналу — у Либіді на містку.</p></section>`}},
};
function openPanel(id){
  const P=PANELS[id];if(!P)return;panelKind=id;nearDev=null;$('#actBtn').hidden=true;$('#tut').hidden=true;joy.on=false;$('#joy').hidden=true;SFX.ui();
  renderPanel();$('#panel').hidden=false;$('#sheet').scrollTop=0;try{TG&&TG.BackButton&&TG.BackButton.show()}catch(e){}
}
function renderPanel(msg){
  const P=PANELS[panelKind];if(!P)return;const keep=$('#sheet').scrollTop;
  $('#pTitle').textContent=typeof P.t==='function'?P.t():P.t;$('#pSub').textContent=P.s;
  $('#pBody').innerHTML=(['ship','modules','conveyor','shop'].includes(panelKind)?testBar():'')+P.b();$('#sheet').scrollTop=keep;
  const la=$('#lybAva');if(la)paintInto(la,T.lyb);if(msg&&$('#lybText'))$('#lybText').textContent=msg;
  const ca=$('#catAva');if(ca)paintInto(ca,T.cat);const cb=$('#cBag');if(cb)paintInto(cb,T.bag);const cj=$('#cCap');if(cj)paintInto(cj,T.capsule);
  document.querySelectorAll('canvas[data-tube]').forEach(c=>paintInto(c,tubeTex(c.dataset.tube)));const oc=$('#orbitCv');if(oc)orbitArt(oc);
  document.querySelectorAll('canvas[data-card]').forEach(c=>paintInto(c,drawCard(+c.dataset.card)));
  document.querySelectorAll('canvas[data-ship]').forEach(c=>paintInto(c,shipTexFor(c.dataset.ship,S.skin)));
  document.querySelectorAll('canvas[data-item]').forEach(c=>{const it=SHOP.find(s=>s.id===c.dataset.item);if(it)paintInto(c,itemIcon(it))});
}
function closePanel(){panelKind=null;$('#panel').hidden=true;nearDev=null;try{TG&&TG.BackButton&&TG.BackButton.hide()}catch(e){}}
$('#closeBtn').addEventListener('click',()=>{SFX.ui();closePanel()});
$('#panel').addEventListener('click',e=>{if(e.target.id==='panel'){closePanel();return}
  const b=e.target.closest('button[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,r=b.dataset.r,k=b.dataset.k;let msg=null;
  if(a==='launch'){launch();return}
  if(a==='earth'){const n=ship.cargo[r],p=Math.round(n*PRICE[r]*payMul());S.credits+=p;S.quota.got[r]+=n;ship.cargo[r]=0;addFleet(n*FLEET_PTS[r]);tx(`Укрзоряниця: ${RNAME[r].toLowerCase()} × ${n}`,p);SFX.coin();
    if(quotaMet())completeQuota()}
  else if(a==='store'){S.store[r]+=ship.cargo[r];ship.cargo[r]=0;SFX.ui()}
  else if(a==='upg'){const u=UPG.find(x=>x.k===k),c=u.costs[L(u.k)-u.base];if(!afford(c))return;pay(c,`Майстерня: ${u.name}`);
    S.lv[u.k]++;SFX.bonus();
    say(pick(LINES.upg))}
  else if(a==='botbuy'){const i=+k,b=BOT_BUY[i];if(!b||!afford(b.cost))return;pay(b.cost,`Конвеєр: бот ${BOT_NAMES[i]}`);S.botLv[i]=1;syncBots();SFX.bonus();say(LINES['bot'+i],5)}
  else if(a==='botup'){const i=+k,lv=S.botLv[i],c=BOT_UP[lv-1];if(!c||!afford(c))return;pay(c,`Конвеєр: ${BOT_NAMES[i]} рів. ${lv+1}`);S.botLv[i]++;SFX.bonus();say(LINES.botUp,4)}
  else if(a==='tipok'){closePanel()}
  else if(a==='tipoff'){S.tipsOff=true;closePanel();say('Підказки вимкнено. Увімкнути знову можна в Либіді на містку.',4)}
  else if(a==='tipson'){S.tipsOff=false;S.tips={};SFX.ui();say('Підказки знову з\'являтимуться в кожній кімнаті.',4)}
  else if(a==='buyship'){const s=SHIPS[k];if(!afford(s.cost))return;pay(s.cost,`Верф: корабель «${s.name}»`);S.owned[k]=true;S.ship=k;SFX.bonus();if(LINES[k])say(LINES[k],6)}
  else if(a==='pickship'){S.ship=k;SFX.ui();say(`У гаражі тепер «${SHIPS[S.ship].name}».`)}
  else if(a==='skin'){S.skin=k;SFX.ui()}
  else if(a==='tab'){shopTab=k;SFX.ui()}
  else if(a==='buy'){const it=SHOP.find(s=>s.id===k);if(it)placeOrder(it)}
  else if(a==='open'){openParcels()}
  else if(a==='ltab'){lybTab=k;SFX.ui()}
  else if(a==='wpick'){S.weapon=k;SFX.ui();say(LINES.weapon)}
  else if(a==='wbuy'){const w=WEAPONS[k];if(!afford(w.cost))return;pay(w.cost,`Зброя: ${w.name}`);S.weapons[k]=true;S.weapon=k;SFX.bonus();say(LINES.weapon)}
  else if(a==='t_mode'){S.testMode=!S.testMode;SFX.ui();say(S.testMode?'Режим тестера: усе безкоштовно.':'Режим тестера вимкнено. Справжній баланс.')}
  else if(a==='ark'){arkBuild(k)}
  else if(a==='t_fleet'){addFleet(250)}
  else if(a==='t_frag'){const i=FRAGS.findIndex((_,j)=>!S.frags.includes(j));if(i>=0){S.frags.push(i);checkAct1()}}
  else if(a==='t_task'){S.tasks.forEach(t=>t.p=t.n);claimTasks()}
  else if(a==='feed'){if(S.cat.food>0){S.cat.food--;S.cat.fedTrip=S.trips;SFX.meow();setTimeout(()=>SFX.purr(),300);msg=LINES.fed;say(LINES.fed,4);catGo({x:51,y:76},'sit')}}
  else if(a==='drones'){const dp=dronePending();if(dp&&dp.total){RES.forEach(x=>S.store[x]+=dp[x]||0);S.droneLast=Date.now();say(LINES.drones);SFX.coin()}}
  else if(a==='donate'){S.lv.engine=Math.max(3,S.lv.engine);say(LINES.donate,5);SFX.bonus()}
  else if(a==='stab'){S.shipTab=k;SFX.ui()}
  else if(a==='tube'){S.loadout[+r]=k||null;SFX.ui()}
  else if(a==='skill'){const x=SKILLS.find(q=>q.k===k);if(x&&spFree()>0&&sk(k)<x.max){S.skills[k]=sk(k)+1;SFX.bonus();hap('success')}}
  else if(a==='respec'){const rc=150*S.shipLv;if(!S.testMode){if(S.credits<rc)return;S.credits-=rc;tx('Скидання навичок',-rc)}S.skills={};SFX.ui();say('Навички скинуто. Очки повернулись.',3)}
  else if(a==='mbuild'){const c={iron:40,ice:40,cr:300};if(!afford(c))return;pay(c,'Модуль: Орбітальний маневр');S.maneuver=true;SFX.bonus();say(LINES.maneuver,6)}
  else if(a==='jump'){const c={ice:15,cr:60};if(!afford(c))return;pay(c,'Орбітальний маневр');const base=Math.floor(Date.now()/SECTOR_MS);S.orbitShift=((+k-base)%4+4)%4;SFX.launch();say(`«Обрій» переходить у ${SECTORS[+k].name.toLowerCase()}.`,4)}
  else if(a==='guide'){closePanel();guide={id:k,t:12};if(r)S.shipTab=r;SFX.ui();return}
  else if(a==='allstore'){RES.forEach(x=>{S.store[x]+=ship.cargo[x];ship.cargo[x]=0});SFX.ui()}
  else if(a==='allearth'){let p=0,pts=0;RES.forEach(x=>{const n=ship.cargo[x];if(!n)return;p+=Math.round(n*PRICE[x]*payMul());S.quota.got[x]+=n;pts+=n*FLEET_PTS[x];ship.cargo[x]=0});if(p){S.credits+=p;tx('Укрзоряниця: увесь вантаж',p);addFleet(pts);SFX.coin();if(quotaMet())completeQuota()}}
  else if(a==='repok'){closePanel();save();return}
  else if(a==='t_lv'){gainXP(XP_NEED(S.shipLv)-S.xp)}
  else if(a==='t_chit'){S.chitin+=30}
  else if(a==='t_tube'){Object.keys(TUBES).forEach(k=>S.tubes[k]=(S.tubes[k]||0)+3)}
  save();renderPanel(msg);hud();
});
function completeQuota(){
  const q=S.quota,rew=150+120*(q.level-1);S.credits+=rew;tx(`Премія за норму ${q.level}-го рівня`,rew);
  q.level++;const Lq=q.level;q.need={ice:20+12*(Lq-1),iron:6+8*(Lq-1),irid:Lq>=3?4*(Lq-2):0};q.got={ice:0,iron:0,irid:0};q.left=4;S.strict=false;
  say(LINES.quota,6);setTimeout(()=>SFX.bonus(),150);
}
$('#actBtn').addEventListener('click',()=>{if(nearDev)interact(nearDev)});
$('#dockBtn').addEventListener('click',()=>{if(mode==='fly')dock()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});

/* ================= LORE INTRO ================= */
const INTRO=[
 {t:'2387 рік. Люди давно освоїли Сонячну систему. На орбіті Сатурна висить стара станція «Обрій». Хто і навіщо її збудував, уже ніхто не пам\'ятає.',img:'saturn'},
 {t:'Ти новий пілот-шахтар. Твоя робота: добувати лід, залізо й іридій у кільцях Сатурна і відправляти руду на Землю.',img:'mine'},
 {t:`Станцією керує бортовий ШІ на ім'я Либідь: балакуча, турботлива й трохи драматична. Ще тут живе рудий кіт ${CAT}. Він тут головний, хоча сам про це не знає.`,img:'crew'},
 {t:'Та останнім часом у кільці знаходять дивні капсули зі старим сигналом. Сто років тому хтось намагався попередити Землю про щось дуже велике.',img:'capsule'},
 {t:'Збирай руду, прокачуй корабель і станцію, розшифровуй сигнал. Схоже, від тебе залежить більше, ніж здається.',img:'go'}
];
let introI=0;
function introArt(kind){
  const c=$('#introCv'),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#0b0812';x.fillRect(0,0,200,110);
  const r=mulberry(7+introI);for(let k=0;k<70;k++){x.fillStyle=r()<.3?'#ffd9a0':'#d8d4ff';x.globalAlpha=.4+r()*.6;x.fillRect((r()*200)|0,(r()*110)|0,1,1)}x.globalAlpha=1;
  if(kind==='saturn'){x.drawImage(T.saturn,0,0);x.drawImage(T.station,120,52)}
  else if(kind==='mine'){x.globalAlpha=.6;x.drawImage(T.saturn,40,-30);x.globalAlpha=1;[[30,60,'ice',2],[150,40,'iron',1],[120,80,'irid',0],[60,25,'iron',0]].forEach(([ax,ay,t,si])=>x.drawImage(T.rock[t][si][0],ax,ay));
    x.save();x.translate(90,64);x.rotate(-Math.PI/4);x.drawImage(shipTexFor('chaika','classic'),-6,-7);x.restore();x.strokeStyle='#ffb347';x.beginPath();x.moveTo(84,58);x.lineTo(46,74);x.stroke()}
  else if(kind==='crew'){x.save();x.scale(3,3);x.drawImage(T.lyb,10,8);x.drawImage(T.kat.sit,42,15);x.restore()}
  else if(kind==='capsule'){for(let k=0;k<4;k++){x.strokeStyle='#7ff5ea';x.globalAlpha=.6-k*.13;x.beginPath();x.arc(100,55,12+k*12,0,6.3);x.stroke()}x.globalAlpha=1;x.save();x.scale(3,3);x.drawImage(T.capsule,31,13);x.restore()}
  else{x.drawImage(T.station,10,30);x.save();x.translate(130,50);x.rotate(Math.PI/2);x.drawImage(shipTexFor(S.ship,S.skin),-6,-7);x.restore();x.drawImage(T.drone,110,40);x.fillStyle='#ff7a2a';x.fillRect(118,50,6,1)}
}
function showIntro(){introI=0;$('#intro').hidden=false;renderIntro()}
function renderIntro(){const sl=INTRO[introI];$('#introText').textContent=sl.t;introArt(sl.img);
  $('#introDots').innerHTML=INTRO.map((_,i)=>`<i class="${i===introI?'on':''}"></i>`).join('');$('#introNext').textContent=introI===INTRO.length-1?'Почати':'Далі'}
function closeIntro(){$('#intro').hidden=true;S.introSeen=true;save();curRoom=null;say(`Привіт, пілоте! Я Либідь. Огляньмося: це гараж, тут стоїть твій корабель. ${CAT} уже десь поруч.`,6);
  if(!S.seenBase){$('#tut').innerHTML='Тягни пальцем, щоб ходити.';$('#tut').hidden=false}}
$('#introNext').addEventListener('click',()=>{audioInit();SFX.ui();if(introI<INTRO.length-1){introI++;renderIntro()}else closeIntro()});
$('#introSkip').addEventListener('click',()=>{audioInit();closeIntro()});

/* ================= BOOT ================= */
BASE=buildBase();
tgInit();
fillTasks();
if(S.flying)S.flying=false;
if(S.testMode)S.strict=false;
if(!S.introSeen){enterBase(null);showIntro()}else enterBase(pick(LINES.greet));S.lybIntro=true;save();
requestAnimationFrame(loop);
window.__game={get enemies(){return enemies},get curSec(){return curSec},doManip,dock,get huges(){return huges},fireHyper,setFiring:v=>firing=v,S,claimTasks,addFleet,man,kat,ship,devices,openPanel,launch,tryGrab,checkDeliveries,get mode(){return mode},get asteroids(){return asteroids},get fleet(){return fleet},MUS,AU};
})();
